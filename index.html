<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabriel Kiveu | Portfolio</title>
  <link rel="icon" href="/portfolio/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/f5b61788d1.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    window.onerror = function(msg, url, line, col, err) {
      document.getElementById('root').innerHTML = '<pre style="color:red;padding:2rem;">Error: ' + msg + '\nAt: ' + url + ':' + line + ':' + col + '\n' + (err && err.stack || '') + '</pre>';
    };
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('root').innerHTML = '<pre style="color:red;padding:2rem;">Unhandled Promise: ' + e.reason + '</pre>';
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
